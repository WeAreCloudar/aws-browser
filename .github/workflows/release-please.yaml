---
name: release-please
on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # Required for trusted publishing to PyPI (OIDC).
      id-token: write
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # The steps below only run when a release was just created (i.e. the
      # release PR was merged). They build the project and publish it to PyPI.
      - name: Checkout code
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@v7

      - name: Install uv
        if: ${{ steps.release.outputs.release_created }}
        uses: astral-sh/setup-uv@v10.2.0

      - name: Build project for distribution
        if: ${{ steps.release.outputs.release_created }}
        run: uv build

      - name: Upload artifacts to release
        if: ${{ steps.release.outputs.release_created }}
        uses: ncipollo/release-action@v1
        with:
          artifacts: "dist/*"
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.release.outputs.tag_name }}
          allowUpdates: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          omitDraftDuringUpdate: true
          omitPrereleaseDuringUpdate: true

      # Trusted publishing: no token needed, uv uses the OIDC token from the
      # id-token: write permission above. Configure the trusted publisher on
      # PyPI first (see README).
      - name: Publish to PyPI
        if: ${{ steps.release.outputs.release_created }}
        run: uv publish
